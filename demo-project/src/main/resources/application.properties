# Database configuration for DAM Framework Demo
# Using H2 in-memory database for easy demo (no MySQL needed)
db.url=jdbc:h2:mem:dam_demo;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:init.sql'
db.username=sa
db.password=
db.dialect=com.dam.framework.dialect.H2Dialect
db.pool.max_size=10

