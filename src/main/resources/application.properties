# ============================================
# DAM Framework - Configuration Properties
# ============================================

# Database Connection Settings
# -------------------------------------------
# MySQL (Default)
db.url=jdbc:mysql://localhost:3306/dam_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.username=root
db.password=yourpassword

# PostgreSQL (Uncomment to use)
# db.url=jdbc:postgresql://localhost:5432/dam_test
# db.username=postgres
# db.password=yourpassword

# SQL Server (Uncomment to use)
# db.url=jdbc:sqlserver://localhost:1433;databaseName=dam_test;encrypt=false
# db.username=sa
# db.password=yourpassword

# Dialect Configuration (Strategy Pattern)
# -------------------------------------------
# Auto-detect from URL (recommended) - leave blank or remove this line
# db.dialect=auto

# Or specify explicitly:
# db.dialect=com.dam.framework.dialect.MySQLDialect
# db.dialect=com.dam.framework.dialect.PostgreSQLDialect
# db.dialect=com.dam.framework.dialect.SQLServerDialect

# Connection Pool Settings (HikariCP)
# -------------------------------------------
db.pool.max_size=10
db.pool.min_idle=2
db.pool.connection_timeout=30000
db.pool.idle_timeout=600000
db.pool.max_lifetime=1800000

# Logging Settings
# -------------------------------------------
db.show_sql=true
db.format_sql=true
